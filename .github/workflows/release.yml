name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-unknown-linux-musl -p latch-cli
      - run: ./scripts/check-static.sh target/x86_64-unknown-linux-musl/release/latch-cli
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/latch-cli-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release latch-cli
          sha256sum dist/latch-cli-x86_64-unknown-linux-musl.tar.gz > dist/SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latch-cli-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS.txt
